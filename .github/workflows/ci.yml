name: CI

on:
  push:
  pull_request:
    branches:
      - trunk

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: ./scripts/run_silent.sh "tests" ./scripts/test.sh
