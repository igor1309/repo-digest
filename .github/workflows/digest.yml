# .github/workflows/digest.yml

name: Weekend Issues Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * 6,0"

jobs:
  build_and_send_digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Specify a Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # We will need the 'requests' library later, so we install it now.
          pip install requests

      - name: Run Digest Generator
        # Pass secrets to the script as environment variables for security
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/generate_digest.py